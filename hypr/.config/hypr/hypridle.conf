# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock                                    # run when the session is asked to lock
    before_sleep_cmd = loginctl lock-session                                 # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # turn display back on after wake
    inhibit_sleep = 3                                                        # wait until the screen is really locked before sleeping
}

