# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot            # blurred screenshot of your desktop
    blur_passes = 3
    blur_size = 6
    color = rgba(25, 20, 20, 1.0) # fallback
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
